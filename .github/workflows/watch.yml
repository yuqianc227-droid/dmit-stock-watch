name: DMIT Pro TINY Restock Monitor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/watch.yml'
      - 'dmit_watch.py'
      - 'probe_sources.py'
  schedule:
    - cron: '3-59/5 * * * *'
  workflow_dispatch:
    inputs:
      send_test:
        description: 'Send a ServerChan test message without checking stock'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: dmit-restock-watch
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Probe source responses (safe diagnostics)
        if: ${{ github.event_name == 'push' }}
        run: python probe_sources.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check stock / push test notification
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          SEND_TEST: ${{ inputs.send_test }}
        run: |
          if [[ "$SEND_TEST" == "true" ]]; then
            python dmit_watch.py --test
          else
            python dmit_watch.py
          fi
      - name: Persist stock state and weekly heartbeat
        if: ${{ success() && inputs.send_test != true }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stock_state.json
          if ! git diff --staged --quiet; then
            git commit -m 'chore: update DMIT stock watcher state [skip ci]'
            git push
          fi
